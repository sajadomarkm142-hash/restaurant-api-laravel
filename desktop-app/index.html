<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:5173 http://localhost:8000" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurant POS</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --accent: #4f46e5;
        --text: #f8fafc;
        --muted: #cbd5e1;
      }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Tahoma, Arial, sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        width: min(700px, 90vw);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        padding: 40px 32px;
        box-shadow: 0 30px 60px rgba(0,0,0,0.4);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 32px;
      }

      p {
        color: var(--muted);
        line-height: 1.7;
        margin: 0 0 18px;
      }

      .badge {
        display: inline-block;
        background: rgba(79, 70, 229, 0.12);
        color: #c7d2fe;
        border: 1px solid rgba(129, 140, 248, 0.4);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">Restaurant POS</div>
      <h1>Starting the application</h1>
      <p>
        The desktop app is trying to connect to the local frontend on <strong>http://localhost:5173</strong>.
      </p>
      <p>
        If the frontend is not running yet, start the project first via Laravel + React and then reopen this app.
      </p>
      <p>
        Backend: http://localhost:8000<br />
        Frontend: http://localhost:5173
      </p>
    </div>
  </body>
</html>
