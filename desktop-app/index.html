<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurant POS</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0f172a;
        color: #f8fafc;
        font-family: Tahoma, Arial, sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 20px;
        padding: 34px 32px;
        max-width: 720px;
        box-shadow: 0 30px 60px rgba(0,0,0,0.45);
      }

      .badge {
        display: inline-block;
        padding: 8px 16px;
        border-radius: 999px;
        background: rgba(79, 70, 229, 0.18);
        border: 1px solid rgba(129, 140, 248, 0.5);
        color: #c7d2fe;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 12px;
        font-weight: 700;
      }

      h1 {
        margin: 18px 0 16px;
        font-size: 44px;
      }

      p {
        margin: 10px 0;
        color: #cbd5e1;
        font-size: 18px;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">Restaurant POS</div>
      <h1>Starting the application</h1>
      <p>Loading local frontend and backend in the background.</p>
      <p>The app is preparing the desktop interface and will launch the restaurant dashboard automatically.</p>
    </div>
  </body>
</html>
